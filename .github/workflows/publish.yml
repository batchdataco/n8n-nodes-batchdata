# Publishes this n8n community node package to npm on every version tag push.
#
# This repo is the canonical npm publish source for n8n-nodes-batchdata.
# Development happens in the private monorepo batchdataco/batchdata-integrations
# under apps/n8n; releases are synced here and tagged here.
#
# n8n requires community nodes to be published from GitHub Actions with npm
# provenance. This workflow publishes ONLY through npm OIDC Trusted Publishing.
# There is no NPM_TOKEN fallback: no long-lived npm secret is used.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# On npmjs.com, package n8n-nodes-batchdata → Settings → Trusted Publishers,
# add a GitHub Actions publisher:
#   Repository owner: batchdataco
#   Repository name:  n8n-nodes-batchdata
#   Workflow name:    publish.yml
#   Environment:      (none)
#
# Before merging: confirm the Trusted Publisher is configured on npmjs.com,
# then delete the NPM_TOKEN repo secret.
#
# Requirements: npm >= 11.5.1 (checked below) and @n8n/node-cli >= 0.23.0.
# In CI, `npm run release` (n8n-node release) runs lint and build, then
# `npm publish` with NPM_CONFIG_PROVENANCE=true.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Check npm version for OIDC trusted publishing
        run: |
          v="$(npm --version)"
          echo "npm $v"
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$v" \
            || { echo "::error::npm >= 11.5.1 is required for OIDC trusted publishing (found $v)"; exit 1; }

      - name: Install dependencies
        run: 'npm ci'

      - name: Release
        run: 'npm run release'
        env:
          NPM_CONFIG_PROVENANCE: 'true'
